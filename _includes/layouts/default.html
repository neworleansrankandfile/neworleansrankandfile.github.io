<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>NOLA Rank and File</title>
  <link rel="stylesheet" href="/css/bootstrap.min.css">
</head>

<body class="d-flex flex-column min-vh-100">
  <nav class="navbar md:navbar-expand sticky-top bg-body border-bottom" aria-label="Main navigation">
    <div class="container">
      <a class="navbar-brand" href="/">NOLA Rank and File</a>
      <button class="btn-icon navbar-toggler" type="button" data-bs-toggle="drawer" data-bs-target="#mainNav"
        aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon" aria-hidden="true"></span>
      </button>
      <dialog class="drawer drawer-end" tabindex="-1" id="mainNav" aria-labelledby="mainNavLabel">
        <div class="drawer-header">
          <h5 class="drawer-title" id="mainNavLabel">Menu</h5>
          <button type="button" class="btn-close" data-bs-dismiss="drawer" aria-label="Close"></button>
        </div>
        <div class="drawer-body">
          <ul class="navbar-nav">
            <li class="nav-item">
              <a class="nav-link" aria-current="page" href="/">Home</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/about/">About</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/contact/">Contact</a>
            </li>
            <li class="nav-item">
              <a class="nav-link" href="/news/">News</a>
            </li>
          </ul>
        </div>
      </dialog>
    </div>
  </nav>

  <main class="flex-grow-1 py-4 md:py-5">
    <div class="container">
      {{ content }}
    </div>
  </main>

  <footer class="border-top">
    <div class="container py-3">
      <p class="mb-0 fg-secondary">&copy; 2026 NOLA Rank and File Project. All power to the workers.</p>
    </div>
  </footer>

  <script type="module" src="/js/bootstrap.bundle.min.js"></script>
</body>

</html>
